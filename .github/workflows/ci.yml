name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: CLI smoke
        run: |
          python src/schema_guard.py --schema samples/ncr.schema.json --data samples/ncr.valid.json
          python src/schema_guard.py --schema samples/ncr.schema.json --data samples/ncr.invalid.json; test $? -eq 1
